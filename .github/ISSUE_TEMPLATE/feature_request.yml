name: Feature request
description: Suggest something new for Omnio One
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting an idea for Omnio One!
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: "I checked there isn't already an [issue](https://github.com/FiTH-g1gGLe/OmnioOne/issues?q=is%3Aissue) for this idea."
          required: true
  - type: textarea
    attributes:
      label: Your idea
      description: What would you like Omnio One to do?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Why it would help
      description: What does it make easier for you?
