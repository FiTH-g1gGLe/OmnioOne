name: Bug report
description: Something in Omnio One isn't working as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make Omnio One better by reporting a bug!
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: "I can reproduce the bug with the [latest version](https://github.com/FiTH-g1gGLe/OmnioOne/releases/latest)."
          required: true
        - label: "I checked there isn't already an [issue](https://github.com/FiTH-g1gGLe/OmnioOne/issues?q=is%3Aissue) for this."
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Omnio One
        2. Tap ...
        3. See the problem
    validations:
      required: true
  - type: input
    attributes:
      label: Omnio One version
      placeholder: e.g. 0.1.97
    validations:
      required: true
  - type: input
    attributes:
      label: Phone and Android version
      placeholder: e.g. OnePlus 15, Android 16
  - type: textarea
    attributes:
      label: Screenshots
      description: Drag any screenshots or screen recordings in here.
