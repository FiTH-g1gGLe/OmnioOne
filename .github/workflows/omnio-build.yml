name: Build Omnio One test APK

# Runs on every change pushed to main, or by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omnio-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the test APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleFossDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Save the error log if the build failed
        if: failure()
        shell: bash
        run: |
          { echo "Build ${{ github.run_number }} failed. Last part of the log:"; echo '```'; grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -80; echo; tail -60 build.log; echo '```'; } > failure.md

      - name: Post the error log
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: Last failed build log
          prerelease: true
          make_latest: false
          body_path: failure.md

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/foss/debug/*.apk "out/OmnioOne-test-${{ github.run_number }}.apk"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: OmnioOne-test-${{ github.run_number }}
          path: out/*.apk

      - name: Publish to the "Latest test build" page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-test
          name: Latest test build
          prerelease: true
          make_latest: false
          body: |
            Test build ${{ github.run_number }} of Omnio One, from commit ${{ github.sha }}.
            On your phone: tap the .apk below to download, then open it to install.
          files: out/*.apk
