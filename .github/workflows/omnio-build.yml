name: Build

# Every change pushed to main is built, tested and published as the latest Omnio One release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omnio-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testFossDebugUnitTest assembleFossDebug \
            -PVERSION_NAME=$VERSION -PVERSION_CODE=${{ github.run_number }} \
            --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Save the error log if the build failed
        if: failure()
        shell: bash
        run: |
          { echo "Build ${{ github.run_number }} failed. Last part of the log:"; echo '```'; grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -80; echo; tail -60 build.log; echo '```'; } > failure.md

      - name: Post the error log
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: Last failed build log
          prerelease: true
          make_latest: false
          body_path: failure.md

      - name: Prepare the download and release notes
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/foss/debug/*.apk out/OmnioOne.apk
          previous=$(git tag --list 'v0.*' --sort=-v:refname | head -1)
          {
            echo "## What's new"
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "$previous"..HEAD
            else
              git log --no-merges --pretty='- %s' -15
            fi
            echo
            echo "## Install"
            echo "1. On your Android phone, tap **OmnioOne.apk** below and open it to install."
            echo "2. If Android blocks some permissions: **Settings → Apps → Omnio One → ⋮ → Allow restricted settings**."
            echo "3. Open Omnio One and set it as your Phone and SMS app."
            echo
            if [ -n "$previous" ]; then echo "**Full list of changes:** https://github.com/${{ github.repository }}/compare/$previous...v$VERSION"; fi
          } > notes.md

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: OmnioOne-${{ env.VERSION }}
          path: out/OmnioOne.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Omnio One ${{ env.VERSION }} (Preview)
          make_latest: true
          body_path: notes.md
          files: out/OmnioOne.apk

      - name: Tidy up the old test-build page
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest-test --yes --cleanup-tag --repo ${{ github.repository }}
